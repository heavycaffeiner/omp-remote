name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache-dependency-path: relay/go.sum
      - run: go vet ./...
        working-directory: relay
      - run: go test -race ./...
        working-directory: relay
      - run: docker build -t omp-remote-relay:ci .
        working-directory: relay

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.1"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app

  # Gradle configuration errors (AAR metadata, desugaring, missing platform
  # scaffolding) surface only in a real Android build, never in analyze or
  # test. Building here keeps them off the release tag.
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - name: Regenerate platform scaffolding
        working-directory: app
        run: |
          flutter create --project-name remote_omp --org works.omp \
            --platforms=android,ios .
          git checkout -- android/app/src/main/AndroidManifest.xml \
                          android/app/build.gradle.kts \
                          ios/Runner/Info.plist
      - run: flutter pub get
        working-directory: app
      - name: Generate icons
        working-directory: app
        run: |
          dart run flutter_launcher_icons
          dart run tool/generate_notification_icon.dart
      - run: flutter build apk --debug
        working-directory: app
