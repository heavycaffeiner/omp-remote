name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  relay-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/omp-remote-relay
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: relay
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      # Only the hand-edited platform files are tracked (see .gitignore), so
      # the gradle scaffolding is regenerated here. `flutter create` overwrites
      # the tracked files, so they are restored from git afterwards.
      - name: Regenerate platform scaffolding
        working-directory: app
        run: |
          flutter create --project-name remote_omp --org works.omp \
            --platforms=android,ios .
          git checkout -- android/app/src/main/AndroidManifest.xml \
                          android/app/build.gradle.kts \
                          ios/Runner/Info.plist
          grep -q 'android:scheme="remote-omp"' \
            android/app/src/main/AndroidManifest.xml
          grep -q 'OMPRemote' android/app/src/main/AndroidManifest.xml
          grep -q 'isCoreLibraryDesugaringEnabled' android/app/build.gradle.kts
          grep -q 'key.properties' android/app/build.gradle.kts
          grep -q 'remote-omp' ios/Runner/Info.plist
          grep -q 'OMPRemote' ios/Runner/Info.plist

      # Signing secrets, set on the repository:
      #   OMPREMOTE_ANDROID_KEYSTORE_BASE64    keystore file, base64 encoded
      #   OMPREMOTE_ANDROID_KEYSTORE_PASSWORD  keystore password
      #   OMPREMOTE_ANDROID_KEY_ALIAS          key alias
      #   OMPREMOTE_ANDROID_KEY_PASSWORD       key password
      # Missing any of them fails the job rather than silently falling back to
      # the debug key, which would ship an APK that can never be upgraded.
      - name: Install the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.OMPREMOTE_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.OMPREMOTE_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OMPREMOTE_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OMPREMOTE_ANDROID_KEY_PASSWORD }}
        working-directory: app/android
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            case "$v" in
              KEYSTORE_PASSWORD) value=$STORE_PASSWORD ;;
              KEYSTORE_BASE64)   value=$KEYSTORE_BASE64 ;;
              KEY_ALIAS)         value=$KEY_ALIAS ;;
              KEY_PASSWORD)      value=$KEY_PASSWORD ;;
            esac
            if [ -z "$value" ]; then
              echo "::error::OMPREMOTE_ANDROID_$v is not set; see the README" >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          cat > key.properties <<'EOF'
          storeFile=upload-keystore.jks
          EOF
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } >> key.properties

      - run: flutter pub get
        working-directory: app

      # res/ was just wiped by `flutter create`, so every generated icon has to
      # be rebuilt here. One step, because the order matters: the Dart tool
      # writes the adaptive foreground that flutter_launcher_icons then
      # consumes, and running them the other way round ships the previous mark.
      - name: Generate the icons
        working-directory: app
        run: |
          dart run tool/generate_notification_icon.dart
          dart run flutter_launcher_icons
          # Existence alone proves little: a generated icon that is present but
          # invisible is how a white-on-white launcher icon once shipped.
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/drawable-xxxhdpi/ic_notification.png
          test -f android/app/src/main/res/drawable-mdpi/ic_notification.png
          test -f android/app/src/main/res/raw/keep.xml
          dart run tool/check_icons.dart
      - run: flutter build apk --release
        working-directory: app

      - name: Verify the APK is signed with the release key
        working-directory: app
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"
          # A debug certificate also contains CN=, so naming it is the only
          # check that distinguishes a real release key from the fallback.
          if echo "$CERTS" | grep -qi 'CN=Android Debug'; then
            echo "::error::APK is debug-signed" >&2
            exit 1
          fi
          if ! echo "$CERTS" | grep -qi 'CN='; then
            echo "::error::APK has no signing certificate" >&2
            exit 1
          fi

      # The resource shrinker has stripped this icon before, which only shows
      # up as a blank notification on a real device. aapt2 lists what actually
      # survived into the built APK.
      - name: Verify the icons survived resource shrinking
        working-directory: app
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          "$AAPT2" dump resources "$APK" > /tmp/res.txt
          grep -q 'drawable/ic_notification' /tmp/res.txt \
            || { echo "::error::ic_notification was stripped from the APK" >&2; exit 1; }
          grep -q 'mipmap/ic_launcher' /tmp/res.txt \
            || { echo "::error::ic_launcher is missing from the APK" >&2; exit 1; }

      - name: Name the artifact after the tag
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk \
             "dist/ompremote-${GITHUB_REF_NAME}.apk"

      - name: Remove the signing material
        if: always()
        working-directory: app/android
        run: rm -f upload-keystore.jks key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

  publish:
    needs: [relay-image, apk]
    runs-on: ubuntu-latest
    steps:
      # The image is tagged by docker/metadata-action's semver pattern, which
      # strips the leading v. The git tag keeps it.
      - name: Derive the image tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v5
        with:
          name: apk
          path: dist
      - name: Checksum
        run: cd dist && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Install

            **Plugin.** This is the only required piece.

            ```sh
            omp plugin install github:heavycaffeiner/omp-remote#${{ github.ref_name }}
            ```

            Then run `/remote-omp` in a session and scan the QR code.

            **App.** Download the APK below and install it on Android. For iOS,
            build from source: the repository has no Apple signing identity.

            **Relay.** Only needed when the phone cannot reach the workstation
            directly. Built for `linux/amd64` and `linux/arm64`.

            ```sh
            docker run -d -p 8787:8787 \
              -e OMP_RELAY_AGENT_TOKEN=... \
              -e OMP_RELAY_CONTROL_TOKEN=... \
              -e OMP_RELAY_VIEWER_TOKEN=... \
              ghcr.io/${{ github.repository_owner }}/omp-remote-relay:${{ steps.version.outputs.value }}
            ```
