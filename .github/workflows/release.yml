name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      # Only the two hand-edited platform files are tracked (see .gitignore),
      # so the gradle scaffolding has to be regenerated here. `flutter create`
      # overwrites AndroidManifest.xml, so the tracked one is restored after.
      - name: Regenerate the android platform folder
        working-directory: app
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          flutter create --project-name remote_omp --org works.omp \
            --platforms=android .
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          grep -q 'android:scheme="remote-omp"' \
            android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
        working-directory: app
      # Debug-signed: a release build needs a keystore this repository does not
      # carry. The APK installs and runs; it is not Play Store material.
      - run: flutter build apk --debug
        working-directory: app
      - name: Name the artifact after the tag
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-debug.apk \
             "dist/remote-omp-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

  relay-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/omp-remote-relay
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: relay
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  relay-binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache-dependency-path: relay/go.sum
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p ../dist
          go build -trimpath -ldflags="-s -w" \
            -o "../dist/omp-remote-relay-${GOOS}-${GOARCH}" .
        working-directory: relay
      - uses: actions/upload-artifact@v4
        with:
          name: relay-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/omp-remote-relay-*

  publish:
    needs: [apk, relay-image, relay-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Collect and checksum
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.apk' -o -name 'omp-remote-relay-*' \) \
            -exec cp {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
