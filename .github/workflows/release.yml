name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  relay-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/omp-remote-relay
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: relay
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      # Only the hand-edited platform files are tracked (see .gitignore), so
      # the gradle scaffolding is regenerated here. `flutter create` overwrites
      # the tracked files, so they are restored from git afterwards.
      - name: Regenerate the android platform folder
        working-directory: app
        run: |
          flutter create --project-name remote_omp --org works.omp \
            --platforms=android .
          git checkout -- android/app/src/main/AndroidManifest.xml \
                          android/app/build.gradle.kts
          grep -q 'android:scheme="remote-omp"' \
            android/app/src/main/AndroidManifest.xml
          grep -q 'key.properties' android/app/build.gradle.kts

      # Fails the job when a signing secret is missing, rather than silently
      # falling back to the debug key and shipping an unverifiable APK.
      - name: Install the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: app/android
        run: |
          for v in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::secret for $v is not set; see the README" >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          cat > key.properties <<'EOF'
          storeFile=upload-keystore.jks
          EOF
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } >> key.properties

      - run: flutter pub get
        working-directory: app
      - run: flutter build apk --release
        working-directory: app

      - name: Verify the APK is signed with the release key
        working-directory: app
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | grep -qi 'CN=' \
            || { echo "::error::APK has no signing certificate" >&2; exit 1; }

      - name: Name the artifact after the tag
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk \
             "dist/remote-omp-${GITHUB_REF_NAME}.apk"

      - name: Remove the signing material
        if: always()
        working-directory: app/android
        run: rm -f upload-keystore.jks key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

  publish:
    needs: [relay-image, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: apk
          path: dist
      - name: Checksum
        run: cd dist && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Install

            **Plugin.** This is the only required piece.

            ```sh
            omp plugin install github:heavycaffeiner/omp-remote#${{ github.ref_name }}
            ```

            Then run `/remote-omp` in a session and scan the QR code.

            **App.** Download the APK below and install it on Android. For iOS,
            build from source: the repository has no Apple signing identity.

            **Relay.** Only needed when the phone cannot reach the workstation
            directly. Built for `linux/amd64` and `linux/arm64`.

            ```sh
            docker run -d -p 8787:8787 \
              -e OMP_RELAY_AGENT_TOKEN=... \
              -e OMP_RELAY_CONTROL_TOKEN=... \
              -e OMP_RELAY_VIEWER_TOKEN=... \
              ghcr.io/${{ github.repository_owner }}/omp-remote-relay:${{ github.ref_name }}
            ```
